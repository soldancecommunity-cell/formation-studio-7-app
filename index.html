  edit(label, () => { fn(f); for (const id in f.pos) f.pos[id] = [r3(f.pos[id][0]), r3(f.pos[id][1])]; });
}
function centroid(f, ids) { let x = 0, y = 0; ids.forEach(id => { x += f.pos[id][0]; y += f.pos[id][1]; }); return [x / ids.length, y / ids.length]; }
function mirrorLR() { const ids = targetIds(); movePositions('左右反転', f => { const all = ids.length === doc.dancers.length; const c = all ? [0, 0] : centroid(f, ids); ids.forEach(id => f.pos[id][0] = 2 * c[0] - f.pos[id][0]); }); }
function mirrorFB() { const ids = targetIds(); movePositions('前後反転', f => { const all = ids.length === doc.dancers.length; const c = all ? [0, 0] : centroid(f, ids); ids.forEach(id => f.pos[id][1] = 2 * c[1] - f.pos[id][1]); }); }
function alignRow() { const ids = targetIds(); if (ids.length < 2) return toast('2人以上を選んでください', 'warn'); movePositions('横一列にそろえる', f => { const y = centroid(f, ids)[1]; ids.forEach(id => f.pos[id][1] = y); }); }
function alignCol() { const ids = targetIds(); if (ids.length < 2) return toast('2人以上を選んでください', 'warn'); movePositions('縦一列にそろえる', f => { const x = centroid(f, ids)[0]; ids.forEach(id => f.pos[id][0] = x); }); }
function distribute(axis) {
  const ids = targetIds(); if (ids.length < 3) return toast('3人以上を選んでください', 'warn');
  movePositions(axis ? '前後を等間隔に' : '左右を等間隔に', f => {
    const s = ids.slice().sort((a, b) => f.pos[a][axis] - f.pos[b][axis]);
    const a = f.pos[s[0]][axis], b = f.pos[s[s.length - 1]][axis];
    s.forEach((id, k) => f.pos[id][axis] = a + (b - a) * k / (s.length - 1));
  });
}
function centerSel() { const ids = targetIds(); movePositions('中央に寄せる', f => { const c = centroid(f, ids); ids.forEach(id => { f.pos[id][0] -= c[0]; }); }); }
function scaleSel(k) { const ids = targetIds(); movePositions(k > 1 ? '広げる' : '狭める', f => { const c = centroid(f, ids); ids.forEach(id => { f.pos[id][0] = c[0] + (f.pos[id][0] - c[0]) * k; f.pos[id][1] = c[1] + (f.pos[id][1] - c[1]) * k; }); }); }
function rotateSel(deg) { const ids = targetIds(); const a = deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a); movePositions('回転', f => { const c = centroid(f, ids); ids.forEach(id => { const dx = f.pos[id][0] - c[0], dy = f.pos[id][1] - c[1]; f.pos[id][0] = c[0] + dx * ca - dy * sa; f.pos[id][1] = c[1] + dx * sa + dy * ca; }); }); }
function swapTwo() {
  const ids = [...ui.sel]; if (ids.length !== 2) return toast('入れ替える2人を選んでください', 'warn');
  movePositions('2人を入れ替え', f => { const t = f.pos[ids[0]]; f.pos[ids[0]] = f.pos[ids[1]]; f.pos[ids[1]] = t; });
}
function applyTemplate(tid) {
  const ids = targetIds(); if (!ids.length) return toast('ダンサーがいません。先に「＋ダンサー」で追加してください', 'warn');
  const t = TEMPLATES.find(x => x.id === tid);
  movePositions('配置：' + (t ? t.n : tid), f => {
    // 今の左右の並び順を保って当てはめる
    const order = ids.slice().sort((a, b) => (f.pos[a][1] - f.pos[b][1]) * 0.3 + (f.pos[a][0] - f.pos[b][0]));
    const pts = tplPoints(tid, ids.length, doc.stage);
    const all = ids.length === doc.dancers.length; const c = all ? [0, 0] : centroid(f, ids);
    const ps = pts.slice().sort((a, b) => (a[1] - b[1]) * 0.3 + (a[0] - b[0]));
    order.forEach((id, k) => f.pos[id] = [clamp(ps[k][0] + c[0], -doc.stage.w / 2, doc.stage.w / 2), clamp(ps[k][1] + (all ? 0 : c[1]), -doc.stage.d / 2, doc.stage.d / 2)]);
    ids.forEach(id => delete f.curve[id]);
  });
}
function copyPositions() { const f = curForm(); ui.clip = { name: f.name, pos: JSON.parse(JSON.stringify(f.pos)) }; toast(`「${f.name}」の立ち位置をコピーしました`); }
function pastePositions() {
  if (!ui.clip) return toast('先に立ち位置をコピーしてください', 'warn');
  movePositions('立ち位置を貼り付け', f => { for (const id in ui.clip.pos) if (f.pos[id]) f.pos[id] = ui.clip.pos[id].slice(); });
}
function sameAsPrev() {
  const i = ensureEditable(); if (i === 0) return toast('最初の隊形です', 'warn');
  edit('前の隊形と同じにする', () => { const f = doc.forms[i], p = doc.forms[i - 1]; for (const id in f.pos) f.pos[id] = p.pos[id].slice(); f.curve = {}; });
}
function straightenPaths(all) {
  const i = curI(); const f = doc.forms[i];
  const ids = all ? Object.keys(f.curve) : [...ui.sel].filter(id => f.curve[id]);
  if (!ids.length) return toast('曲がった動線はありません', 'warn');
  edit('動線をまっすぐに', () => ids.forEach(id => delete f.curve[id]));
}

// ---------- 隊形（タイムラインのクリップ） ----------
function addFormAfter(i, copy = true) {
  let ni;
  edit('隊形を追加', () => {
    const src = doc.forms[i];
    const f = newForm(nextFormName());
    f.hold = defaultHold(); f.trans.dur = defaultTrans(); f.light = JSON.parse(JSON.stringify(src.light || lightDefault()));
    if (copy) for (const id in src.pos) f.pos[id] = src.pos[id].slice();
    doc.forms.splice(i + 1, 0, f); ni = i + 1;
  });
  ui.tlSel = 'form'; seek(holdStartOf(ni)); refreshAll();
}
function addFormAtPlayhead() { addFormAfter(curI(), true); }
function dupForm(i) {
  edit('隊形を複製', () => { const f = JSON.parse(JSON.stringify(doc.forms[i])); f.id = uid(); f.name = f.name + ' のコピー'; if (f.trans.dur === 0 && f.trans.type !== 'cut') f.trans.dur = defaultTrans(); doc.forms.splice(i + 1, 0, f); });
  seek(holdStartOf(i + 1)); refreshAll();
}
// 削除：ripple=false なら時間を前の隊形に渡す（後ろの時間はずれない）
function deleteForm(i, ripple = false) {
  if (doc.forms.length <= 1) return toast('最後の1つの隊形は削除できません', 'warn');
  const name = doc.forms[i].name;
  edit((ripple ? '削除して詰める：' : '隊形を削除：') + name, () => {
    const f = doc.forms[i], td = transDur(f, i);
    if (!ripple) {
      if (i > 0) doc.forms[i - 1].hold += td + f.hold;
      else { const nx = doc.forms[1]; nx.hold += f.hold + transDur(nx, 1); nx.trans.dur = 0; }
    } else if (i === 0) doc.forms[1].trans.dur = 0;
    doc.forms.splice(i, 1);
  });
  seek(holdStartOf(Math.max(0, i - (ripple ? 0 : 1)))); refreshAll();
}
function moveForm(from, to) {
  if (from === to || to < 0 || to >= doc.forms.length) return;
  edit('隊形の順番を変更', () => {
    const [f] = doc.forms.splice(from, 1); doc.forms.splice(to, 0, f);
    doc.forms.forEach(g => g.curve = g.curve || {});
    doc.forms[0].trans.dur = 0;
    doc.forms.forEach((g, k) => { if (k > 0 && g.trans.dur === 0 && g.trans.type !== 'cut') g.trans.dur = defaultTrans(); });
  });
  seek(holdStartOf(to)); refreshAll();
}
function setHold(i, v, label = '静止時間を変更') { edit(label, () => doc.forms[i].hold = Math.max(MIN_HOLD, r3(v))); }
function setTrans(i, patch, label = '繋ぎを変更') {
  if (i <= 0) return;
  edit(label, () => {
    const tr = doc.forms[i].trans;
    if (patch.type && patch.type !== 'cut' && tr.type === 'cut' && !(tr.dur > 0)) tr.dur = defaultTrans();
    if (patch.type && patch.type !== 'cut' && !(tr.dur > 0) && patch.dur == null) tr.dur = defaultTrans();
    Object.assign(tr, patch);
    tr.dur = Math.max(0, r3(tr.dur));
  });
}
function setTransType(type) {
  const i = curI();
  if (i === 0) { if (doc.forms.length > 1) return setTransTypeAt(1, type); return toast('隊形が2つ以上になると繋ぎを選べます', 'warn'); }
  setTransTypeAt(i, type);
}
function setTransTypeAt(i, type) { setTrans(i, { type }, '繋ぎ：' + TRANS_TYPES[type]); ui.tlSel = 'trans'; refreshAll(); }

// 分割（カット）：再生位置で隊形を2つに切る
function splitAt(t) {
  const s = sched(), L = locate(t), i = L.i, f = doc.forms[i];
  const EPS = 0.04;
  if (L.phase === 'hold' || i === 0) {
    const off = t - s.hs[i];
    if (off < EPS || f.hold - off < EPS) return toast('隊形の端に近すぎて分割できません。再生位置を少し動かしてください', 'warn');
    edit('分割：' + f.name, () => {
      const g = JSON.parse(JSON.stringify(f)); g.id = uid(); g.name = f.name + '（後）';
      g.hold = r3(f.hold - off); g.trans = Object.assign({}, f.trans, { dur: 0, type: 'move', wave: 0 }); g.curve = {}; g.note = '';
      f.hold = r3(off);
      doc.forms.splice(i + 1, 0, g);
    });
    seek(holdStartOf(i + 1));
  } else {
    const td = s.hs[i] - s.ts[i], u = t - s.ts[i];
    if (u < EPS || td - u < EPS) return toast('繋ぎの端に近すぎて分割できません', 'warn');
    const fr = frameAt(t, {});
    edit('繋ぎを分割：' + f.name, () => {
      const m = newForm(f.name + '（途中）'); m.hold = 0; m.light = JSON.parse(JSON.stringify(doc.forms[i - 1].light || lightDefault()));
      for (const d of doc.dancers) { const o = fr[d.id]; m.pos[d.id] = f.trans.type === 'dissolve' ? (o.a >= 0.5 ? [o.x, o.y] : [o.gx, o.gy]) : [r3(o.x), r3(o.y)]; }
      const ease = f.trans.ease;
      m.trans = Object.assign({}, f.trans, { dur: r3(u), ease: ease === 'inout' ? 'in' : ease });
      f.trans.dur = r3(td - u); if (ease === 'inout') f.trans.ease = 'out';
      for (const id in f.curve) delete f.curve[id];
      doc.forms.splice(i, 0, m);
    });
    seek(t);
  }
  ui.tlSel = 'form'; refreshAll();
}

// 0秒の静止＆0秒の繋ぎで、見えない隊形をまとめる
function cleanupZero() {
  for (let k = doc.forms.length - 2; k >= 1; k--) {
    const f = doc.forms[k], nx = doc.forms[k + 1];
    if (f.hold < 1e-3 && transDur(f, k) < 1e-3 && transDur(nx, k + 1) < 1e-3) doc.forms.splice(k, 1);
  }
}
// 範囲をカット（イン〜アウトを切り取って詰める）。withAudio なら音源の同じ所も切る
function rangeCut(a, b, withAudio) {
  if (!(b - a > 0.05)) return toast('イン（I）とアウト（O）で範囲を決めてください', 'warn');
  const total = totalTime();
  a = clamp(a, 0, total); b = clamp(b, 0, total);
  if (b - a < 0.05) return toast('範囲が作品の外です', 'warn');
  const label = `範囲をカット ${fmtT(a)}〜${fmtT(b)}`;
  edit(label, () => {
    // 1) 範囲の両端で分割（端が隊形の境目なら何もしない）
    const cutAt = t => {
      const s = sched(); const L = locate(t), i = L.i, f = doc.forms[i];
      if (L.phase === 'hold' || i === 0) {
        const off = t - s.hs[i];
        if (off <= 1e-4 || f.hold - off <= 1e-4) return;
        const g = JSON.parse(JSON.stringify(f)); g.id = uid(); g.hold = f.hold - off; g.trans = Object.assign({}, f.trans, { dur: 0, type: 'move', wave: 0 }); g.curve = {};
        f.hold = off; doc.forms.splice(i + 1, 0, g); invalidate();
      } else {
        const td = s.hs[i] - s.ts[i], u = t - s.ts[i]; if (u <= 1e-4 || td - u <= 1e-4) return;
        const fr = frameAt(t, {}); const m = newForm(f.name + '（途中）'); m.hold = 0; m.light = JSON.parse(JSON.stringify(doc.forms[i - 1].light || lightDefault()));
        for (const d of doc.dancers) { const o = fr[d.id]; m.pos[d.id] = [r3(o.x), r3(o.y)]; }
        m.trans = Object.assign({}, f.trans, { dur: u }); f.trans.dur = td - u; doc.forms.splice(i, 0, m); invalidate();
      }
    };
    cutAt(b); cutAt(a);
    // 2) 範囲内の時間を0にする
    let s = sched();
    for (let i = 0; i < s.n; i++) {
      const f = doc.forms[i];
      if (i > 0 && s.ts[i] >= a - 1e-4 && s.hs[i] <= b + 1e-4) { f.trans.dur = 0; }
      if (s.hs[i] >= a - 1e-4 && s.he[i] <= b + 1e-4) f.hold = 0;
    }
    invalidate(); cleanupZero(); invalidate();
    doc.forms.forEach(f => { f.hold = r3(f.hold); f.trans.dur = r3(f.trans.dur); });
    // 3) 目印・テンポ
    const len = b - a;
    doc.markers = doc.markers.filter(m => m.t < a || m.t > b).map(m => (m.t > b ? Object.assign(m, { t: r3(m.t - len) }) : m));
    if (doc.beat.first > b) doc.beat.first = r3(doc.beat.first - len);
    // 4) 音源も同じ所を切る
    if (withAudio && doc.audio) cutAudioRange(a, b);
  });
  ui.inT = ui.outT = null;
  seek(a); refreshAll();
  toast(`${fmtT(b - a)} を切り取りました` + (withAudio && doc.audio ? '（音源も一緒に）' : ''), 'ok', { action: undo, actionLabel: '元に戻す' });
}
function cutAudioRange(a, b) {
  const au = doc.audio, len = b - a;
  if (b <= au.offset) { au.offset = r3(au.offset - len); return; }
  const ea = Math.max(0, a - au.offset), eb = b - au.offset;
  const sa = e2s(ea, au.cuts), sb = e2s(eb, au.cuts);
  au.cuts = mergeCuts(au.cuts.concat([[r3(sa), r3(sb)]]));
  if (a < au.offset) au.offset = r3(a);
}

// ---------- 目印 ----------
function addMarker(t, name) {
  edit('目印を追加', () => doc.markers.push({ id: uid(), t: r3(t), name: name || '目印 ' + (doc.markers.length + 1) }));
  refreshAll();
}

/* ===== store.js ===== */
// ============================================================
//  保存：端末の中（IndexedDB）＋ 緊急用の控え（localStorage）＋ 自動バックアップ（履歴）
//  claude.ai で開いたときは、あなた専用のクラウド保存にも同期する
// ============================================================
const DB_NAME = 'formation-studio-7';
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const DEVICE = LS.get('fs7.device') || (() => { const d = uid(); LS.set('fs7.device', d); return d; })();

const Store = {
  idb: null, mem: null,
  async init() {
    this.idb = await new Promise(res => {
      try {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('meta', { keyPath: 'id' });
          d.createObjectStore('docs');
          d.createObjectStore('blobs');
          d.createObjectStore('snaps', { keyPath: 'sid' }).createIndex('pid', 'pid');
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
        setTimeout(() => res(null), 4000);
      } catch (e) { res(null); }
    });
    if (!this.idb) { this.mem = { meta: new Map(), docs: new Map(), blobs: new Map(), snaps: new Map() }; }
    return !!this.idb;
  },
  _req(store, mode, fn) {
    if (this.mem) return Promise.resolve(fn(null, this.mem[store]));
    return new Promise((res, rej) => {
      const t = this.idb.transaction(store, mode), os = t.objectStore(store);
      let out; const r = fn(os);
      if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
    });
  },
  listMeta() { return this._req('meta', 'readonly', (os, m) => os ? os.getAll() : null).then(v => this.mem ? [...this.mem.meta.values()] : (v || [])); },
  getMeta(id) { return this._req('meta', 'readonly', (os, m) => os ? os.get(id) : null).then(v => this.mem ? this.mem.meta.get(id) : v); },
  getDoc(id) { return this._req('docs', 'readonly', (os, m) => os ? os.get(id) : null).then(v => this.mem ? this.mem.docs.get(id) : v); },
  putDoc(d, meta) {
    if (this.mem) { this.mem.docs.set(d.id, JSON.parse(JSON.stringify(d))); this.mem.meta.set(meta.id, meta); return Promise.resolve(); }
    return new Promise((res, rej) => {
      const t = this.idb.transaction(['docs', 'meta'], 'readwrite');
      t.objectStore('docs').put(d, d.id); t.objectStore('meta').put(meta);
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('保存が中断されました'));
    });
  },
  putMeta(meta) { return this._req('meta', 'readwrite', (os, m) => os ? os.put(meta) : m.set(meta.id, meta)); },
  async removeProject(id) {
    const snaps = await this.listSnaps(id);
    if (this.mem) { this.mem.meta.delete(id); this.mem.docs.delete(id); snaps.forEach(s => this.mem.snaps.delete(s.sid)); return; }
    await new Promise((res, rej) => {
      const t = this.idb.transaction(['docs', 'meta', 'snaps'], 'readwrite');
      t.objectStore('docs').delete(id); t.objectStore('meta').delete(id);
      snaps.forEach(s => t.objectStore('snaps').delete(s.sid));
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  },
  putBlob(k, v) { return this._req('blobs', 'readwrite', (os, m) => os ? os.put(v, k) : m.set(k, v)); },
  getBlob(k) { return this._req('blobs', 'readonly', (os, m) => os ? os.get(k) : null).then(v => this.mem ? this.mem.blobs.get(k) : v); },
  delBlob(k) { return this._req('blobs', 'readwrite', (os, m) => os ? os.delete(k) : m.delete(k)); },
  addSnap(pid, json, reason) { const s = { sid: pid + ':' + Date.now(), pid, t: Date.now(), reason, json, size: json.length }; return this._req('snaps', 'readwrite', (os, m) => os ? os.put(s) : m.set(s.sid, s)); },
  listSnaps(pid) {
    if (this.mem) return Promise.resolve([...this.mem.snaps.values()].filter(s => s.pid === pid).sort((a, b) => b.t - a.t));
    return new Promise((res) => {
      const out = []; const t = this.idb.transaction('snaps', 'readonly');
      const r = t.objectStore('snaps').index('pid').openCursor(IDBKeyRange.only(pid));
      r.onsuccess = () => { const c = r.result; if (c) { const v = c.value; out.push({ sid: v.sid, pid: v.pid, t: v.t, reason: v.reason, size: v.size }); c.continue(); } };
      t.oncomplete = () => res(out.sort((a, b) => b.t - a.t)); t.onerror = () => res(out);
    });
  },
  getSnap(sid) { return this._req('snaps', 'readonly', (os, m) => os ? os.get(sid) : null).then(v => this.mem ? this.mem.snaps.get(sid) : v); },
  async pruneSnaps(pid, keep = 40) {
    const list = await this.listSnaps(pid);
    const del = list.slice(keep);
    for (const s of del) await this._req('snaps', 'readwrite', (os, m) => os ? os.delete(s.sid) : m.delete(s.sid));
  }
};

function metaOf(d, prev) {
  return {
    id: d.id, title: d.title, updated: d.updated, created: d.created,
    dancers: d.dancers.length, forms: d.forms.length, dur: (() => { let c = 0; d.forms.forEach((f, i) => c += transDur(f, i) + f.hold); return c; })(),
    audioName: d.audio ? d.audio.name : '', audioKey: d.audio ? d.audio.key : '',
    thumb: (prev && prev.thumb) || '', trashed: (prev && prev.trashed) || 0, trashT: (prev && prev.trashT) || 0
  };
}

// ---------- 自動保存 ----------
const Saver = {
  dirty: false, timer: 0, state: 'saved', lastAt: 0, lastSnap: 0, lastThumb: 0, meta: null, err: '',
  touch() {
    if (!doc) return;
    this.dirty = true; this.setState('saving');
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 300);
    this.mirror();
  },
  mirror() {
    // 書き込みが終わる前にタブが落ちても、ここから戻せる
    if (!doc) return;
    LS.set('fs7.mirror', JSON.stringify({ id: doc.id, at: Date.now(), doc }));
  },
  async flush() {
    clearTimeout(this.timer);
    if (!this.dirty || !doc) return true;
    this.dirty = false;
    doc.updated = Date.now();
    const d = doc;
    const meta = metaOf(d, this.meta);
    if (Date.now() - this.lastThumb > 15000 || !meta.thumb) { try { meta.thumb = makeThumb(d); this.lastThumb = Date.now(); } catch (e) { } }
    this.meta = meta;
    try {
      await Store.putDoc(d, meta);
      this.lastAt = Date.now(); this.err = '';
      LS.set('fs7.mirror', JSON.stringify({ id: d.id, at: Date.now(), doc: d, saved: true }));
      this.setState(this.dirty ? 'saving' : 'saved');
      if (Date.now() - this.lastSnap > 180000) { this.lastSnap = Date.now(); Store.addSnap(d.id, JSON.stringify(d), '自動').then(() => Store.pruneSnaps(d.id)).catch(() => { }); }
      Cloud.schedule(d.id);
      askPersist();
      return true;
    } catch (e) {
      this.dirty = true; this.err = (e && e.name === 'QuotaExceededError') ? '端末の空き容量が足りません' : '保存できませんでした';
      this.setState('error');
      return false;
    }
  },
  setState(s) {
    this.state = s;
    const b = byId('saveBadge'); if (!b) return;
    b.classList.toggle('saving', s === 'saving'); b.classList.toggle('err', s === 'error');
    byId('saveT').textContent = s === 'error' ? '保存できません' : s === 'saving' ? '保存中' : (Cloud.on ? (Cloud.state === 'err' ? '保存済み（クラウド再試行中）' : '保存済み・クラウド') : '保存済み');
    b.dataset.tip = s === 'error' ? this.err : '押すと保存の履歴（復元）';
    if (s === 'error' && !this._warned) { this._warned = true; toast('保存できませんでした。「書き出し」から作品ファイルを保存してください', 'err', { action: () => openExport(), actionLabel: '書き出す' }); }
    if (s !== 'error') this._warned = false;
  }
};
let _persistAsked = false;
function askPersist() {
  if (_persistAsked) return; _persistAsked = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
}
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { Saver.flush(); Cloud.flushNow(); } else { Cloud.checkRemote(); } });
addEventListener('pagehide', () => { if (doc) { LS.set('fs7.mirror', JSON.stringify({ id: doc.id, at: Date.now(), doc, saved: !Saver.dirty })); Saver.flush(); } });

// 落ちる前の控えから復元（起動時）
async function recoverMirror() {
  const raw = LS.get('fs7.mirror'); if (!raw) return null;
  try {
    const m = JSON.parse(raw); if (!m || !m.doc || !m.id) return null;
    const cur = await Store.getDoc(m.id);
    if (!cur || (m.doc.updated || 0) > (cur.updated || 0) || (!m.saved && JSON.stringify(cur) !== JSON.stringify(m.doc))) {
      const d = normalizeDoc(m.doc); d.updated = Date.now();
      const prev = await Store.getMeta(d.id);
      await Store.putDoc(d, metaOf(d, prev));
      return d.title;
    }
  } catch (e) { }
  return null;
}

// ============================================================
//  クラウド同期（claude.ai の中で開いたときだけ）
//  data/users/<あなたのID>/p-<作品ID> に保存。ほかの人からは見えない
// ============================================================
const CHUNK = 70000;
const Cloud = {
  on: false, state: 'off', db: null, uidv: null, col: null, q: new Set(), timer: 0, busy: false, lastErr: '',
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return false;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return false;
      const id = await user.id(); if (!id) return false;
      this.db = db; this.uidv = id; this.col = db.collection('data/users/' + id);
      this.on = true; this.setState('sync');
      await this.pullAll();
      this.setState('ok');
      return true;
    } catch (e) { this.lastErr = e && (e.code || e.message) || ''; this.setState(this.on ? 'err' : 'off'); return false; }
  },
  setState(s) { this.state = s; Saver.setState(Saver.state); if (typeof renderHomeRes === 'function' && byId('home') && !byId('home').hidden) renderHomeRes(); },
  ref(id) { return this.col.doc(id); },
  async readFull(head) {
    const h = head.data();
    if (h.json != null) return JSON.parse(h.json);
    let s = '';
    for (let k = 0; k < (h.n || 0); k++) { const c = await this.ref(head.id + '-c' + k).get(); if (!c.exists) throw new Error('chunk missing'); s += c.data().s; }
    return JSON.parse(s);
  },
  async pullAll() {
    const snap = await this.col.get();
    const heads = snap.docs.filter(d => /^p-[A-Za-z0-9]+$/.test(d.id));
    const local = new Map((await Store.listMeta()).map(m => [m.id, m]));
    let got = 0;
    for (const hd of heads) {
      const h = hd.data(), pid = hd.id.slice(2), lm = local.get(pid);
      if (h.deleted) { if (lm) { await Store.removeProject(pid); got++; } continue; }
      if (!lm || (h.updated || 0) > (lm.updated || 0) + 500) {
        try {
          const d = normalizeDoc(await this.readFull(hd));
          d.updated = h.updated || d.updated;
          if (lm) { const old = await Store.getDoc(pid); if (old) await Store.addSnap(pid, JSON.stringify(old), '別の端末の内容を受け取る前'); }
          const meta = metaOf(d, lm); meta.thumb = h.thumb || meta.thumb; meta.trashed = h.trashed || 0; meta.trashT = h.trashT || 0;
          await Store.putDoc(d, meta); got++;
        } catch (e) { }
      } else {
        // ゴミ箱の出し入れは、あとから操作した方を採る
        const tc = h.trashT || 0, tl = lm.trashT || 0;
        if (tc > tl) { await Store.putMeta(Object.assign({}, lm, { trashed: h.trashed || 0, trashT: tc })); got++; }
        if ((lm.updated || 0) > (h.updated || 0) + 500 || tl > tc) this.q.add(pid);
      }
      local.delete(pid);
    }
    for (const pid of local.keys()) this.q.add(pid);   // クラウドにまだ無い作品を上げる
    if (this.q.size) this.kick(200);
    return got;
  },
  schedule(pid) { if (!this.on) return; this.q.add(pid); this.kick(2500); },
  kick(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  flushNow() { if (this.on && this.q.size) this.run(); },
  async run() {
    if (this.busy || !this.on) return; this.busy = true; this.setState('sync');
    try {
      while (this.q.size) {
        const pid = this.q.values().next().value; this.q.delete(pid);
        await this.push(pid);
      }
      this.setState('ok');
    } catch (e) {
      this.lastErr = e && (e.code || e.message) || '';
      this.setState('err');
      if (e && e.code === 'quota_exceeded') toast('クラウドの保存枠がいっぱいです。この端末には保存されています', 'warn');
      if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) this.kick(8000);
    } finally { this.busy = false; }
  },
  async push(pid) {
    const meta = await Store.getMeta(pid); const d = await Store.getDoc(pid);
    if (!meta || !d) { await this.ref('p-' + pid).set({ deleted: true, updated: Date.now() }); return; }
    const json = JSON.stringify(d);
    const head = { title: meta.title, updated: d.updated || Date.now(), dancers: meta.dancers, forms: meta.forms, dur: meta.dur, audioName: meta.audioName || '', thumb: (meta.thumb || '').length < 30000 ? meta.thumb || '' : '', trashed: meta.trashed || 0, trashT: meta.trashT || 0, device: DEVICE };
    if (json.length <= CHUNK) { head.json = json; head.n = 0; }
    else {
      const n = Math.ceil(json.length / CHUNK);
      for (let k = 0; k < n; k++) await this.ref('p-' + pid + '-c' + k).set({ s: json.slice(k * CHUNK, (k + 1) * CHUNK) });
      head.n = n;
    }
    await this.ref('p-' + pid).set(head);
  },
  async removeForever(pid) {
    if (!this.on) return;
    try {
      const h = await this.ref('p-' + pid).get();
      const n = h.exists ? (h.data().n || 0) : 0;
      await this.ref('p-' + pid).set({ deleted: true, updated: Date.now() });
      for (let k = 0; k < n; k++) await this.ref('p-' + pid + '-c' + k).delete();
    } catch (e) { }
  },
  // 別の端末で更新されていたら知らせる
  async checkRemote() {
    if (!this.on || !doc || this.busy) return;
    try {
      const h = await this.ref('p-' + doc.id).get(); if (!h.exists) return;
      const v = h.data();
      if (v.device !== DEVICE && (v.updated || 0) > (doc.updated || 0) + 1500 && !Saver.dirty) {
        toast('別の端末でこの作品が更新されています', 'warn', { ms: 9000, actionLabel: '最新にする', action: async () => {
          const d = normalizeDoc(await this.readFull(h)); d.updated = v.updated;
          await Store.addSnap(doc.id, JSON.stringify(doc), '別の端末の内容を受け取る前');
          await Store.putDoc(d, metaOf(d, Saver.meta)); openProject(d.id);
        } });
      }
    } catch (e) { }
  }
};

/* ===== audio.js ===== */
// ============================================================
//  音源：再生（<audio> で流す＝メモリが軽い）、波形（一度だけ計算して保存）、テンポ検出
// ============================================================
const PPS = 100;  // 波形：1秒あたり100点
const Aud = {
  el: null, url: null, key: null, peaks: null, missing: false, busy: false,
  init() {
    this.el = new Audio(); this.el.preload = 'auto';
    try { this.el.preservesPitch = true; this.el.mozPreservesPitch = true; this.el.webkitPreservesPitch = true; } catch (e) { }
    this.el.addEventListener('error', () => { if (this.url) { this.missing = false; } });
  },
  release() {
    try { this.el.pause(); } catch (e) { }
    if (this.url) { URL.revokeObjectURL(this.url); this.url = null; }
    this.el.removeAttribute('src'); try { this.el.load(); } catch (e) { }
    this.peaks = null; this.key = null; this.missing = false;
  },
  setBlob(blob, key) {
    if (this.url) URL.revokeObjectURL(this.url);
    this.url = URL.createObjectURL(blob); this.key = key;
    this.el.src = this.url; this.missing = false;
    this.el.volume = doc.audio ? doc.audio.vol : 1;
  },
  async attach() {
    this.release();
    if (!doc.audio) return;
    const a = doc.audio;
    let blob = null; try { blob = await Store.getBlob(a.key); } catch (e) { }
    if (!blob) { this.missing = true; markDirty(); return; }
    this.setBlob(blob, a.key);
    let pk = null; try { pk = await Store.getBlob('pk-' + a.key); } catch (e) { }
    if (pk) this.peaks = new Uint8Array(pk);
    else this.analyze(blob, a.key, false);
    markDirty();
  },
  // ファイルを読み込む（同じ曲を別の端末で選び直したときは keepTiming で位置・カットを保つ）
  async loadFile(file, keepTiming) {
    if (!file) return;
    if (!/^audio\//.test(file.type) && !/\.(mp3|m4a|aac|wav|ogg|flac|mp4)$/i.test(file.name)) { toast('音源ファイル（mp3・m4a・wav など）を選んでください', 'err'); return; }

async function exportVideo3D({ hd = false, cam = 'front', info = true } = {}) {

    ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.font = `700 ${22 * k}px ${FONT}`; ctx.fillStyle = '#eef0f4';
    ctx.fillText(`${L.i + 1}. ${f.name}`, 24 * k, 30 * k, W * 0.5);
    ctx.font = `500 ${15 * k}px ${FONT}`; ctx.fillStyle = 'rgba(238,240,244,0.75)'; ctx.fillText('照明：' + lightName(f), 24 * k, 56 * k, W * 0.5);

  };

async function packWork(id, withAudio) {
  const d = id === (doc && doc.id) ? doc : await Store.getDoc(id); if (!d) return null;
  const out = { doc: JSON.parse(JSON.stringify(d)) };
  if (withAudio && d.audio) { const b = await Store.getBlob(d.audio.key); if (b) out.audio = { name: d.audio.name, type: b.type || d.audio.type || 'audio/mpeg', data: await blobToB64(b) }; }
  return out;
}
async function exportProjects(ids, withAudio) {
  if (doc) await Saver.flush();
  const works = []; for (const id of ids) { const w = await packWork(id, withAudio); if (w) works.push(w); }
  if (!works.length) return;
  const obj = works.length === 1 ? Object.assign({ app: 'FormationStudio7', formatVersion: MUSE_FORMAT_VERSION, v: 7, exported: new Date().toISOString() }, works[0]) : { app: 'FormationStudio7', formatVersion: MUSE_FORMAT_VERSION, v: 7, exported: new Date().toISOString(), works };
  const name = works.length === 1 ? (works[0].doc.title || '作品').replace(/\s+/g, '_').slice(0, 40) : 'FormationStudio_作品' + works.length;
  await saveFile(`${name}.json`, new Blob([JSON.stringify(obj)], { type: 'application/json' }));
}
async function exportAll() {
  const ids = (await Store.listMeta()).filter(m => !m.trashed).map(m => m.id);
  if (!ids.length) return toast('作品がありません', 'warn');
  const d = new Date();
  const works = []; for (const id of ids) { const w = await packWork(id, false); if (w) works.push(w); }
  await saveFile(`FormationStudio_全作品_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`, new Blob([JSON.stringify({ app: 'FormationStudio7', v: 7, exported: d.toISOString(), works })], { type: 'application/json' }));
}

/* ===== muse.js ===== */
// ============================================================
//  Muse 連携：Muse（クラウドのAI）が書いた JSON を、新しい作品として読み込む
//  ・形式番号（formatVersion）つきのファイル／貼り付けだけを厳しく調べる。付いていない作品ファイルは今までどおり
//  ・Muse は立ち位置を「バミリ番号 bami（上手が＋）」と「前からの距離 z（m）」で書ける
//    → 内部の形 [x, y] に直す（x = bami × バミリ間隔、y = z − 奥行き/2）
//  ・エラーがあれば読み込まない。注意だけなら「このまま読み込む」を選べる。どちらも Muse に伝える文を出す
//  ・説明書（MUSE_GUIDE.md）の本文は build.mjs が MUSE_GUIDE_MD として埋め込む
// ============================================================
const MUSE_FORMAT_VERSION = 1;
const MUSE_OVERLAP = 0.4;                  // これより近い2人は「重なり」の注意
const MUSE_WING_X = 2.5, MUSE_WING_Y = 0.6; // 袖：ドラッグで置ける範囲（stage.js と同じ）
const museNum = v => typeof v === 'number' && isFinite(v);
const museObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const museJ = v => { try { return v === undefined ? 'なし' : JSON.stringify(v); } catch (e) { return String(v); } };
const museNorm = s => String(s).normalize('NFKC').replace(/\s+/g, '').toLowerCase();
const museR = v => +(+v).toFixed(2);

// 英語の値でも日本語の名前でも受ける（例：type "dissolve" / "ディゾルブ"）
function museKey(v, table, extra = {}) {
  if (typeof v !== 'string') return null;
  if (table[v]) return v;
  const s = museNorm(v);
  for (const k in table) if (museNorm(k) === s || museNorm(table[k]) === s || museNorm(table[k]).replace(/\(.*\)$/, '') === s) return k;
  for (const k in extra) if (museNorm(k) === s) return extra[k];
  return null;
}
const MUSE_EASE_EXTRA = { '一定': 'linear', '等速': 'linear', 'ふつう': 'inout' };
const MUSE_DIR_EXTRA = { '中央から': 'co', '外へ': 'co', '左から': 'lr', '右から': 'rl' };
const MUSE_FADES = { cross: 'クロスフェード', cut: 'カットイン' };
const MUSE_FADE_EXTRA = { 'クロス': 'cross', 'カット': 'cut' };
// 照明の名前：id（"backsus"）でも日本語の名前（"バックサス"）でも。かっこの中だけ（"SS"）でもよい
function museScene(v) {
  if (typeof v !== 'string') return null;
  if (LIGHT_BY_ID[v]) return LIGHT_BY_ID[v];
  const s = museNorm(v);
  return LIGHT_SCENES.find(x => museNorm(x.id) === s || museNorm(x.n) === s || museNorm(x.n).replace(/\(.*\)$/, '') === s || (museNorm(x.n).match(/\((.*)\)$/) || [])[1] === s) || null;
}
// 色："#ffcf8a" / "#fc8" のほか、照明は色フィルターの名前（"アンバー" "青" など）も
function museColor(v, gels) {
  if (typeof v !== 'string') return null;
  if (/^#[0-9a-f]{6}$/i.test(v)) return v;
  if (/^#[0-9a-f]{3}$/i.test(v)) return '#' + v.slice(1).split('').map(c => c + c).join('');
  if (gels) { const g = GELS.find(x => museNorm(x[1]) === museNorm(v)); if (g) return g[0]; }
  return null;
}
// バミリ番号：数字（＋が上手＝客席から見て右、−が下手）のほか "上手3" "下手2.5" "センター" も読む
function museBami(v) {
  if (museNum(v)) return v;
  if (typeof v !== 'string') return null;
  const s = v.normalize('NFKC').replace(/\s+/g, '').replace(/[−‐－–]/g, '-').replace(/番$/, '');
  if (s === 'センター' || s === '中央' || s === 'ヘソ' || s === '0') return 0;
  let m;
  if ((m = s.match(/^(上手|かみて|カミテ)(\d+(?:\.\d+)?)$/))) return +m[2];
  if ((m = s.match(/^(下手|しもて|シモテ)(\d+(?:\.\d+)?)$/))) return -m[2];
  if (/^[+-]?\d+(?:\.\d+)?$/.test(s)) return +s;
  return null;
}
// 内部の位置 [x, y] を「上手 3番・前から 2m」の言い方に（画面の表示と同じ数え方）
function musePosText(p, b, dd) {
  const k = p[0] / b;
  return `${Math.abs(p[0]) < 0.05 ? 'センター' : (p[0] > 0 ? '上手 ' : '下手 ') + museR(Math.abs(k)) + '番'}・前から ${museR(p[1] + dd / 2)}m`;
}
// 立ち位置1つを [x, y] に。読めなければエラーの文を返す
function musePoint(p, b, dd) {
  if (Array.isArray(p)) {
    if (p.length !== 2 || !museNum(p[0]) || !museNum(p[1])) return `[x, y] の形の数字2つにしてください（今は ${museJ(p)}）`;
    return { p: [p[0], p[1]], native: true };
  }
  if (!museObj(p)) return `{"bami": 0, "z": 2} の形にしてください（今は ${museJ(p)}）`;
  const hasB = p.bami != null, hasX = p.x != null;
  if (hasB && hasX) return 'bami と x が両方あります。どちらか1つにしてください';
  if (!hasB && !hasX) return '横の位置（bami）がありません';
  let x;
  if (hasB) { const k = museBami(p.bami); if (k == null) return `bami ${museJ(p.bami)} が読めません。数字（上手が＋、下手が−）か "上手3" "下手2" "センター" で書いてください`; x = k * b; }
  else { if (!museNum(p.x)) return `x ${museJ(p.x)} が数字ではありません`; x = p.x; }
  if (p.z == null) return p.y != null ? 'y ではなく z（前からの距離・m）で書いてください' : 'z（前からの距離・m）がありません';
  if (!museNum(p.z)) return `z ${museJ(p.z)} が数字ではありません（" " で囲まないでください）`;

// "curve"（おまかせの曲線）：移動の長さの 1/4 だけ横にふくらませる。ふくらむ向きはステージの中央側
function museAutoCurve(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
  if (len < 0.05) return null;
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, nx = -dy / len, ny = dx / len;
  const s = Math.hypot(mx + nx, my + ny) <= Math.hypot(mx - nx, my - ny) ? 1 : -1;
  return [r3(mx + s * nx * len * 0.5), r3(my + s * ny * len * 0.5)];
}

// ---------- 中身のチェックと、アプリの形へのそろえ ----------
// 戻り値 { E: エラー[], W: 注意[], works: [{doc, audio}] }。E が1つでもあれば works は null
function museCheck(src) {

  if (!museObj(src)) { E.push('いちばん外側を { … } の形にしてください。'); return { E, W, works: null }; }
  if (src.formatVersion == null) W.push('formatVersion（形式の番号）がありません。1 として読みます。Muse には "formatVersion": 1 を書くよう伝えてください。');

  if (k === ' ') { e.preventDefault(); Play.toggle(); return; }
  if (k === 'Escape') { if (curPop) closePop(); else if (document.body.classList.contains('insp-show')) openInspector(false); else { ui.sel.clear(); ui.inT = ui.outT = null; selectionChanged(); markDirty(); } return; }
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); if (ui.sel.size) askRemoveDancers([...ui.sel]); else deleteForm(curI(), e.shiftKey); return; }
  if (k.startsWith('Arrow')) {
    e.preventDefault();
    if (ui.sel.size) { const st = e.shiftKey ? 0.5 : 0.1; const dx = k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, dy = k === 'ArrowUp' ? st : k === 'ArrowDown' ? -st : 0; movePositions('少し動かす', f => ui.sel.forEach(id => { f.pos[id][0] += dx; f.pos[id][1] += dy; })); return; }
    if (k === 'ArrowUp') stepForm(-1); else if (k === 'ArrowDown') stepForm(1);
    else { const bl = beatLen(); seek(ui.t + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : (bl || 0.1))); }
    return;
  }
  const K = k.toLowerCase();
  if (K === 'c') { splitAt(ui.t); return; }
  if (K === 'n') { addFormAtPlayhead(); return; }
  if (K === 'a') { addDancerDialog(); return; }
  if (K === 'i') { setIn(); return; }
  if (K === 'o') { setOut(); return; }
  if (K === 'x' && e.shiftKey) { askRangeCut(); return; }
  if (K === 'l') { ui.loop = !ui.loop; renderRangeChip(); toast(ui.loop ? 'くり返し再生' : 'くり返しをやめました', 'ok', { ms: 1000 }); return; }
  if (K === 'm') { addMarker(ui.t); return; }
  if (K === 't') { const v = Tap.tap(); if (v) { invalidate(); markDirty(); toast(`テンポ ${v} BPM`, 'ok', { ms: 900 }); clearTimeout(onKey._t); onKey._t = setTimeout(refreshAll, 1500); } else toast('曲に合わせて T を4回以上', 'ok', { ms: 900 }); return; }
  if (K === 'p') { toggleOpt('paths', '動線の表示'); return; }
  if (K === 'g') { toggleOpt('snap', '吸着'); return; }
  if (K === '0') { Stage.fit(); TL.fit(); return; }
  if (K === 'home') { seek(0); return; }
  if (K === 'end') { seek(totalTime()); return; }
  if (K === '?') { openGuide(); return; }
  if (K === '1') showTab('form'); else if (K === '2') showTab('dancer'); else if (K === '3') showTab('audio');
}
function onKeyUp(e) { if (e.key === ' ') Stage.space = false; }

// ---------- 画面の大きさ ----------
function applyLayout() {
  const w = innerWidth, hh = innerHeight;
  const small = Math.min(w, hh) < 560 || w < 900;
  document.body.classList.toggle('compact', small);
  document.body.classList.toggle('landscape', small && w > hh);
  if (!small) document.body.classList.remove('insp-show');
  const saved = LS.get('fs7.tlh' + (small ? 'c' : ''));
  if (saved && parseFloat(saved) > 100 && parseFloat(saved) < hh * 0.62) document.documentElement.style.setProperty('--tl-h', saved.trim()); else document.documentElement.style.removeProperty('--tl-h');
  _selKey = '';
  if (doc) { updateTlButtons(); renderInspector(); }
}

// ---------- 作品を開く／閉じる ----------
async function openProject(id) {
  if (doc && Saver.dirty) await Saver.flush();
  let d = await Store.getDoc(id);
  if (!d) { toast('作品を開けませんでした', 'err'); return; }
  doc = normalizeDoc(d); invalidate(); histReset();
  Saver.meta = await Store.getMeta(id) || null; Saver.lastSnap = Date.now(); Saver.lastThumb = 0; Saver.dirty = false;
  Store.addSnap(id, JSON.stringify(doc), '開いたとき').then(() => Store.pruneSnaps(id)).catch(() => { });
  ui.t = 0; ui.sel = new Set(); ui.tlSel = 'form'; ui.inT = ui.outT = null; ui.loop = false; ui.playing = false;
  ui.tab = LS.get('fs7.tab') || 'form'; if (!TABS.some(t => t.id === ui.tab)) ui.tab = 'form';
  if (!doc.dancers.length) ui.tab = 'dancer';
  LS.set('fs7.last', id);
  byId('home').hidden = true; byId('editor').hidden = false;
  Saver.setState('saved');
  await Aud.attach();
  requestAnimationFrame(() => { Stage.resize(); TL.resize(); Stage.fit(true); TL.fit(); refreshAll(); });
}
async function goHome() {
  if (ui.playing) Play.stop();
  if (view3d.on) { ui.view = '2d'; view3d.close(); byId('editor').classList.remove('v3d', 'split'); }
  if (doc) { Saver.lastThumb = 0; Saver.dirty = true; await Saver.flush(); }
  clearTimeout(Saver._mt); clearTimeout(Saver.timer); Aud.release(); doc = null; histReset(); LS.del('fs7.mirror');
  document.body.classList.remove('insp-show');
  byId('editor').hidden = true; byId('home').hidden = false;
  renderHome();
}

// ---------- 起動 ----------
async function boot() {
  fillIcons(document);
  Aud.init(); Stage.init(); TL.init(); bindTlBar(); bindHome();
  applyLayout(); addEventListener('resize', debounce(() => { applyLayout(); if (view3d.on) view3d.resize(); }, 80));
  addEventListener('keydown', e => { if (e.key === ' ' && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) Stage.space = true; onKey(e); });
  addEventListener('keyup', onKeyUp);
  byId('btnHome').addEventListener('click', goHome);
  byId('nameplate').addEventListener('click', async () => { const v = await promptBox('作品名', doc.title, { label: '作品の名前' }); if (v != null && v.trim()) { edit('作品名を変更', () => doc.title = v.trim().slice(0, 80)); refreshAll(); } });
  byId('btnUndo').addEventListener('click', undo); byId('btnRedo').addEventListener('click', redo);
  byId('saveBadge').addEventListener('click', e => { e.stopPropagation(); openHistory(); });
  byId('btnHelp').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); contextMenu(r.right - 220, r.bottom + 6, [
    { label: '画面ガイド', icon: 'help', run: openGuide },
    { label: '機能をさがす', icon: 'search', key: '⌘K', run: openPalette },
    { label: 'キー操作の一覧', icon: 'keyboard', run: openKeys },
    { label: '保存の履歴（復元）', icon: 'history', run: openHistory }]); });
  byId('btnExport').addEventListener('click', () => openExport());
  byId('fileAudio').addEventListener('change', e => { const f = e.target.files[0]; const keep = e.target.dataset.keep === '1'; e.target.value = ''; e.target.dataset.keep = ''; if (f && doc) Aud.loadFile(f, keep || (doc.audio && Aud.missing)); });
  byId('fileProj').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; importFiles(fs); });
  // ファイルのドロップ
  let dragN = 0;
  addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragN++; byId('dropAll').classList.add('on'); byId('dropAll').textContent = doc ? '曲のファイルを落とすと読み込みます' : '作品ファイル（.json）を落とすと読み込みます'; } });
  addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) byId('dropAll').classList.remove('on'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => {
    e.preventDefault(); dragN = 0; byId('dropAll').classList.remove('on');
    const fs = [...(e.dataTransfer && e.dataTransfer.files || [])]; if (!fs.length) return;
    const au = fs.find(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|ogg|flac)$/i.test(f.name));
    if (au && doc) { Aud.loadFile(au, false); return; }
    importFiles(fs.filter(f => /\.(json|fs7|flogic)$/i.test(f.name) || f.type === 'application/json'));
  });
  document.fonts && document.fonts.ready.then(() => markDirty());

  const ok = await Store.init();
  const rec = await recoverMirror();
  renderHome();
  byId('boot') && byId('boot').remove();
  if (!ok) toast('この環境では端末に保存できません。作業したら「書き出し」で作品ファイルを保存してください', 'err', { ms: 9000 });
  if (rec) toast(`前回の作業「${rec}」を最後の状態まで復元しました`, 'ok', { ms: 5000 });
  initDownloads();
  Cloud.init().then(ok2 => { if (ok2) { renderHome(); } });
  window.FS = { get doc() { return doc; }, ui, refreshAll, updateTlButtons, Stage, TL, Play, Aud, Store, Saver, Cloud, sched, locate, frameAt, splitAt, rangeCut, addFormAfter, deleteForm, setTrans, addDancers, setLight, openArrange, openStageSettings, applyTemplate, openProject, goHome, undo, redo, H, totalTime, seek, importParsed, normalizeDoc, e2s, s2e, view3d, openExport, createProject, LIGHT_SCENES, LIGHT_BY_ID, normLight, lookAt };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

function openKeys() {
  const rows = [['Space', '再生／停止'], ['N', '隊形を追加'], ['C', '再生位置で分割'], ['⌘Z / ⌘⇧Z', '元に戻す／やり直す'], ['⌘C / ⌘V', '立ち位置のコピー／貼り付け'], ['⌘D', '隊形を複製'], ['Delete', '選んだメンバー（いなければ隊形）を削除'],
    ['↑ ↓', '前／次の隊形'], ['← →', '少し進む・戻る（メンバーを選んでいるときは少し動かす）'], ['A', 'メンバーを追加'], ['⌘A', '全員を選ぶ'], ['I / O', '範囲の始まり／終わり'], ['L', 'くり返し再生'], ['T', 'テンポをタップ'], ['⌘K', '機能をさがす'], ['0', '全体を表示']];
  modal({ title: 'キー操作', icon: 'keyboard', body: `<table class="keys">${rows.map(([k, v]) => `<tr><td><kbd>${esc(keyLabel(k))}</kbd></td><td>${esc(v)}</td></tr>`).join('')}</table>`, buttons: [{ label: '閉じる', cls: 'n', value: null, primary: true }] });
}
